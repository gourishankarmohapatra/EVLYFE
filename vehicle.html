<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Vehicle Details | EVLYFE</title>
  <meta name="description" content="View detailed specifications, price, range, and features of this electric vehicle on EVLYFE.">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EVLYFE">
  <meta name="twitter:card" content="summary_large_image">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ECY26LBRLK"></script>
  <script>window.dataLayer = window.dataLayer || [];function gtag(){dataLayer.push(arguments);}gtag('js', new Date());gtag('config', 'G-ECY26LBRLK');</script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6950966761441733" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <div id="app">
    <header id="mainHeader"></header>

    <section class="listing-section">
      <div class="container">
        <div id="vehicleContent">
          <div class="loading-spinner"></div>
        </div>
      </div>
    </section>

    <section class="compare-section" id="relatedSection" style="display:none;">
      <div class="container">
        <div class="section-header">
          <h2>Related Vehicles</h2>
          <p>You might also be interested in these vehicles</p>
        </div>
        <div class="vehicle-grid" id="relatedGrid"></div>
      </div>
    </section>

    <section class="faq-section">
      <div class="container">
        <div class="section-header"><h2>FAQs</h2></div>
        <div class="faq-list" id="faqList"></div>
      </div>
    </section>

    <footer id="mainFooter"></footer>
    <div id="backToTopBtn"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    document.getElementById('mainHeader').innerHTML = Navigation.getHeader();
    document.getElementById('mainFooter').innerHTML = Navigation.getFooter();
    document.getElementById('backToTopBtn').innerHTML = Navigation.getBackToTop();

    const slug = new URLSearchParams(window.location.search).get('slug');

    function renderStars(rating) {
      let html = '';
      for (let i = 1; i <= 5; i++) {
        html += `<i class="bi bi-star${i <= Math.floor(rating) ? '' : '-fill'} star${i > rating ? ' empty' : ''}"></i>`;
      }
      return html;
    }

    function addToCompare(vehicle) {
      let compareList = JSON.parse(localStorage.getItem('evlyfe_compare') || '[]');
      if (compareList.find(v => v._id === vehicle._id)) {
        alert('This vehicle is already in your comparison list.');
        return;
      }
      if (compareList.length >= 3) {
        alert('You can compare up to 3 vehicles at a time.');
        return;
      }
      compareList.push({ _id: vehicle._id, title: vehicle.title, image: vehicle.image, slug: vehicle.slug });
      localStorage.setItem('evlyfe_compare', JSON.stringify(compareList));
      Navigation.updateCompareCount();
      alert(`${vehicle.title} added to comparison!`);
    }

    function loadVehicle() {
      if (!slug) {
        document.getElementById('vehicleContent').innerHTML = '<div class="no-results"><h3>Vehicle not found</h3><p>Please go back and select a vehicle.</p></div>';
        return;
      }
      const v = API.getVehicleBySlug(slug);
      if (!v) {
        document.getElementById('vehicleContent').innerHTML = '<div class="no-results"><h3>Vehicle not found</h3></div>';
        return;
      }

      document.title = `${v.title} - Price, Range, Specs | EVLYFE`;

      // Dynamic SEO meta tags
      const metaDesc = `${v.title} - Price: ${v.price_display}, Range: ${v.true_range} km, Top Speed: ${v.top_speed} km/h. Compare specs, features & reviews on EVLYFE.`;
      document.querySelector('meta[name="description"]').setAttribute('content', metaDesc);
      const pageUrl = `https://www.evlyfe.com/vehicle.html?slug=${v.slug}`;
      let canonicalEl = document.querySelector('link[rel="canonical"]');
      if (!canonicalEl) { canonicalEl = document.createElement('link'); canonicalEl.rel = 'canonical'; document.head.appendChild(canonicalEl); }
      canonicalEl.href = pageUrl;
      const ogTitle = document.querySelector('meta[property="og:title"]');
      const ogDesc = document.querySelector('meta[property="og:description"]');
      const ogUrl = document.querySelector('meta[property="og:url"]');
      const ogImage = document.querySelector('meta[property="og:image"]');
      const twTitle = document.querySelector('meta[name="twitter:title"]');
      const twDesc = document.querySelector('meta[name="twitter:description"]');
      const twImage = document.querySelector('meta[name="twitter:image"]');
      if (ogTitle) ogTitle.setAttribute('content', `${v.title} | EVLYFE`);
      if (ogDesc) ogDesc.setAttribute('content', metaDesc);
      if (ogUrl) ogUrl.setAttribute('content', pageUrl);
      if (ogImage) ogImage.setAttribute('content', v.image);
      if (twTitle) twTitle.setAttribute('content', `${v.title} | EVLYFE`);
      if (twDesc) twDesc.setAttribute('content', metaDesc);
      if (twImage) twImage.setAttribute('content', v.image);

      // JSON-LD Product schema
      const productSchema = {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": v.title,
        "description": metaDesc,
        "image": v.image,
        "brand": {"@type": "Brand", "name": v.company},
        "offers": {
          "@type": "Offer",
          "priceCurrency": "INR",
          "price": v.price,
          "availability": "https://schema.org/InStock",
          "url": pageUrl
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": v.rating,
          "reviewCount": v.review_count
        }
      };
      const ldScript = document.createElement('script');
      ldScript.type = 'application/ld+json';
      ldScript.text = JSON.stringify(productSchema);
      document.head.appendChild(ldScript);

      // JSON-LD BreadcrumbList
      const breadcrumbSchema = {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.evlyfe.com/"},
          {"@type": "ListItem", "position": 2, "name": "Electric Vehicles", "item": "https://www.evlyfe.com/electric-vehicles.html"},
          {"@type": "ListItem", "position": 3, "name": v.title, "item": pageUrl}
        ]
      };
      const bcScript = document.createElement('script');
      bcScript.type = 'application/ld+json';
      bcScript.text = JSON.stringify(breadcrumbSchema);
      document.head.appendChild(bcScript);

      const specs = v.specifications || {};
      const features = v.features || [];

      document.getElementById('vehicleContent').innerHTML = `
        <p class="breadcrumb" style="font-size:13px;margin-bottom:20px;">
          <a href="index.html">Home</a> / <a href="electric-vehicles.html">Electric Vehicles</a> / ${v.title}
        </p>
        <div class="row">
          <div class="col-12 col-lg-6 vehicle-detail">
            <div class="detail-gallery">
              <img id="mainImage" src="${v.images?.[0] || v.image}" alt="${v.title}">
              <div class="thumbnails">
                ${(v.images || [v.image]).map((img, i) => `
                  <img src="${img}" alt="${v.title} ${i+1}" class="${i===0?'active':''}" onclick="changeImage(this, '${img}')">
                `).join('')}
              </div>
            </div>
          </div>
          <div class="col-12 col-lg-6 vehicle-detail">
            <div class="detail-info">
              <h1>${v.title}</h1>
              <p class="brand-name">by ${v.company} | ${v.vehicle_type_name}</p>
              <div class="rating">
                ${renderStars(v.rating)}
                <span class="rating-text">${v.rating} (${v.review_count} reviews)</span>
              </div>
              <p class="price">${v.price_display}</p>
              <p style="font-size:13px;color:#666;">On-Road Price may vary based on location and accessories.</p>

              <div class="quick-specs">
                <div class="quick-spec">
                  <div class="spec-icon"><i class="bi bi-speedometer2"></i></div>
                  <div class="spec-val">${v.top_speed}</div>
                  <div class="spec-label">km/h Top Speed</div>
                </div>
                <div class="quick-spec">
                  <div class="spec-icon"><i class="bi bi-battery-charging"></i></div>
                  <div class="spec-val">${v.true_range}</div>
                  <div class="spec-label">km True Range</div>
                </div>
                <div class="quick-spec">
                  <div class="spec-icon"><i class="bi bi-clock-history"></i></div>
                  <div class="spec-val">${v.charging_time.split(' ')[0]}h</div>
                  <div class="spec-label">Charging Time</div>
                </div>
                <div class="quick-spec">
                  <div class="spec-icon"><i class="bi bi-battery-full"></i></div>
                  <div class="spec-val">${v.battery_capacity}</div>
                  <div class="spec-label">kWh Battery</div>
                </div>
              </div>

              <div style="display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;">
                <a href="compare.html?ids=${v._id}" class="btn-apply" style="flex:1;text-align:center;padding:12px;">Compare</a>
                <button class="btn-clear" style="flex:1;padding:12px;" onclick='addToCompare(${JSON.stringify(v).replace(/'/g,"\\'")})'>+ Add to Compare</button>
              </div>

              <p style="font-size:13px;"><strong>Waiting Period:</strong> ${v.waiting_period}</p>
              <p style="font-size:13px;"><strong>Colors:</strong> ${(v.colors||[]).join(', ')}</p>
            </div>
          </div>
        </div>

        <div class="vehicle-detail detail-tabs" style="margin-top:40px;">
          <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('specs')">Specifications</button>
            <button class="tab-btn" onclick="switchTab('features')">Features</button>
            <button class="tab-btn" onclick="switchTab('description')">Description</button>
            ${(v.videos && v.videos.length > 0) ? '<button class="tab-btn" onclick="switchTab(\'videos\')">Videos</button>' : ''}
          </div>
          <div class="tab-content active" id="tab-specs">
            <div class="specs-grid">
              <div class="spec-row"><span class="spec-name">Price</span><span class="spec-value">${v.price_display}</span></div>
              <div class="spec-row"><span class="spec-name">Vehicle Type</span><span class="spec-value">${v.vehicle_type_name}</span></div>
              <div class="spec-row"><span class="spec-name">Battery Capacity</span><span class="spec-value">${v.battery_capacity} kWh</span></div>
              <div class="spec-row"><span class="spec-name">True Range</span><span class="spec-value">${v.true_range} km</span></div>
              <div class="spec-row"><span class="spec-name">Top Speed</span><span class="spec-value">${v.top_speed} km/h</span></div>
              <div class="spec-row"><span class="spec-name">Charging Time</span><span class="spec-value">${v.charging_time}</span></div>
              <div class="spec-row"><span class="spec-name">Fast Charging</span><span class="spec-value">${v.fast_charging}</span></div>
              <div class="spec-row"><span class="spec-name">Motor Type</span><span class="spec-value">${v.motor_type}</span></div>
              <div class="spec-row"><span class="spec-name">Power</span><span class="spec-value">${v.power} kW</span></div>
              <div class="spec-row"><span class="spec-name">Torque</span><span class="spec-value">${v.torque} Nm</span></div>
              <div class="spec-row"><span class="spec-name">Seating Capacity</span><span class="spec-value">${v.seating_capacity}</span></div>
              <div class="spec-row"><span class="spec-name">Kerb Weight</span><span class="spec-value">${v.weight} kg</span></div>
              <div class="spec-row"><span class="spec-name">Boot Space</span><span class="spec-value">${v.boot_space} L</span></div>
              <div class="spec-row"><span class="spec-name">Body Type</span><span class="spec-value">${specs.body_type || '-'}</span></div>
              <div class="spec-row"><span class="spec-name">Ground Clearance</span><span class="spec-value">${specs.ground_clearance || '-'} mm</span></div>
              <div class="spec-row"><span class="spec-name">Wheelbase</span><span class="spec-value">${specs.wheelbase || '-'} mm</span></div>
              <div class="spec-row"><span class="spec-name">Drivetrain</span><span class="spec-value">${specs.drivetrain || '-'}</span></div>
              <div class="spec-row"><span class="spec-name">Transmission</span><span class="spec-value">${specs.transmission || '-'}</span></div>
            </div>
          </div>
          <div class="tab-content" id="tab-features">
            <div class="features-list">
              ${features.length > 0 ? features.map(f => `<span class="feature-tag"><i class="bi bi-check-circle-fill" style="color:var(--primary-teal);margin-right:5px;"></i>${f}</span>`).join('') : '<p>No features listed.</p>'}
            </div>
          </div>
          <div class="tab-content" id="tab-description">
            <p style="line-height:1.8;color:#555;">
              The ${v.title} by ${v.company} is a ${v.vehicle_type_name.toLowerCase()} that offers a true range of ${v.true_range} km on a single charge. 
              With a top speed of ${v.top_speed} km/h and a ${v.battery_capacity} kWh battery, it is designed for both city commutes and highway rides. 
              The ${v.motor_type} motor produces ${v.power} kW of power and ${v.torque} Nm of torque, ensuring a smooth and responsive ride.
              ${v.fast_charging !== 'N/A' ? ` It also supports fast charging, going from 10-80% in just ${v.fast_charging}.` : ''}
              With a seating capacity of ${v.seating_capacity} and ${v.boot_space}L of boot space, it is practical for everyday use.
            </p>
          </div>
          ${(v.videos && v.videos.length > 0) ? `
          <div class="tab-content" id="tab-videos">
            <div class="videos-list" style="display:flex;flex-direction:column;gap:20px;">
              ${v.videos.map(vid => `
                <div class="video-item">
                  <h4 style="margin-bottom:8px;color:#333;">${vid.title}</h4>
                  <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--radius-md);background:#000;">
                    <iframe src="${vid.url}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen loading="lazy"></iframe>
                  </div>
                  <p style="font-size:11px;color:#888;margin-top:4px;">Source: ${vid.source}</p>
                </div>
              `).join('')}
            </div>
          </div>
          ` : ''}
        </div>
      `;

      // Load related vehicles
      const related = API.getVehicles({ vehicle_type: String(v.vehicle_type), limit: 4 }).docs.filter(rv => rv._id !== v._id).slice(0, 3);
      if (related.length > 0) {
        document.getElementById('relatedSection').style.display = 'block';
        document.getElementById('relatedGrid').innerHTML = related.map(rv => `
          <div class="vehicle-card">
            <img src="${rv.image}" alt="${rv.title}" class="card-image" loading="lazy">
            <div class="card-body">
              <h3 class="card-title">${rv.title}</h3>
              <p class="card-subtitle">by ${rv.company}</p>
              <div class="card-stats">
                <div class="stat-item"><div class="stat-value">${rv.price_display}</div><div class="stat-label">Price</div></div>
                <div class="stat-item"><div class="stat-value">${rv.true_range} km</div><div class="stat-label">Range</div></div>
              </div>
            </div>
            <div class="card-footer"><a href="vehicle.html?slug=${rv.slug}" class="btn-view-details">View Details</a></div>
          </div>
        `).join('');
      }
    }

    function changeImage(thumb, src) {
      document.getElementById('mainImage').src = src;
      document.querySelectorAll('.thumbnails img').forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      event.target.classList.add('active');
    }

    function loadFAQs() {
      const faqs = API.getFAQs().slice(0, 4);
      document.getElementById('faqList').innerHTML = faqs.map(f => `
        <div class="faq-item" onclick="this.classList.toggle('open')">
          <div class="faq-question"><span>${f.question}</span><span class="faq-toggle">+</span></div>
          <div class="faq-answer">${f.answer}</div>
        </div>
      `).join('');

      // JSON-LD FAQPage schema
      if (faqs.length > 0) {
        const faqSchema = {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": faqs.map(f => ({
            "@type": "Question",
            "name": f.question,
            "acceptedAnswer": {
              "@type": "Answer",
              "text": f.answer
            }
          }))
        };
        const faqScript = document.createElement('script');
        faqScript.type = 'application/ld+json';
        faqScript.text = JSON.stringify(faqSchema);
        document.head.appendChild(faqScript);
      }
    }

    async function init() { await API.loadData(); loadVehicle(); loadFAQs(); }
    init();
  </script>
</body>
</html>
