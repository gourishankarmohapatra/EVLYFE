<body>
  <div id="app">
    <header id="mainHeader"></header>

    <section class="page-hero">
      <div class="container">
        <h1>Electric Scooters in India 2026</h1>
        <p class="breadcrumb">
          <a href="index.html">Home</a> / <a href="electric-vehicles.html">Electric Vehicles</a> / Electric Scooters
        </p>
      </div>
    </section>

    <!-- ========== BANNER CAROUSEL ========== -->
    <section class="banner-carousel-section">
      <div id="bannerCarousel"></div>
    </section>

    <section class="listing-section">
      <div class="container">
        <div class="row">
          <div class="col-12 col-lg-3">
            <div class="filter-sidebar" id="filterSidebar"></div>
          </div>
          <div class="col-12 col-lg-9">
            <button class="mobile-filter-toggle" onclick="openFilterDrawer()">
              <i class="bi bi-funnel"></i> Filter & Sort
            </button>
            <div class="vehicle-grid" id="vehicleGrid"></div>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="filter-drawer" id="filterDrawer">
      <div class="filter-drawer-content" id="filterDrawerContent"></div>
    </div>

    <footer id="mainFooter"></footer>
    <div id="backToTopBtn"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/banner-carousel.js"></script>
  <script>
    document.getElementById('mainHeader').innerHTML = Navigation.getHeader();
    document.getElementById('mainFooter').innerHTML = Navigation.getFooter();
    document.getElementById('backToTopBtn').innerHTML = Navigation.getBackToTop();

    let currentPage = 1;
    const ITEMS_PER_PAGE = 9;

    const urlParams = new URLSearchParams(window.location.search);
    const searchQuery = urlParams.get('search') || '';
    const brandFilter = urlParams.get('brand') || '';

    function openFilterDrawer() {
      const drawer = document.getElementById('filterDrawer');
      const content = document.getElementById('filterDrawerContent');
      content.innerHTML = `
        <div class="drawer-header">
          <h3>Filters</h3>
          <button class="drawer-close" onclick="closeFilterDrawer()">&times;</button>
        </div>
        ${document.getElementById('filterSidebar').innerHTML}
      `;
      drawer.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeFilterDrawer() {
      document.getElementById('filterDrawer').classList.remove('open');
      document.body.style.overflow = '';
    }

    function renderFilters() {
      const brands = API.getBrands().filter(b => b.vehicle_types.includes(2));
      document.getElementById('filterSidebar').innerHTML = `
        <h3>Filter By</h3>
        <div class="filter-group">
          <h4>Brand</h4>
          ${brands.map(b => `
            <label><input type="checkbox" name="brand" value="${b.slug}" ${b.slug === brandFilter ? 'checked' : ''} onchange="applyFilters()"> ${b.name}</label>
          `).join('')}
        </div>
        <div class="filter-group">
          <h4>Sort By</h4>
          <select name="sort" onchange="applyFilters()">
            <option value="popular">Popular</option>
            <option value="price_low">Price: Low to High</option>
            <option value="price_high">Price: High to Low</option>
            <option value="range">Range: High to Low</option>
            <option value="speed">Top Speed: High to Low</option>
            <option value="rating">Rating: High to Low</option>
          </select>
        </div>
        <div class="filter-actions">
          <button class="btn-apply" onclick="applyFilters()">Apply</button>
          <button class="btn-clear" onclick="clearFilters()">Clear</button>
        </div>
      `;
    }

    function getFilterValues() {
      const brands = [...document.querySelectorAll('input[name="brand"]:checked')].map(c => c.value).join(',');
      const sort = document.querySelector('select[name="sort"]')?.value || 'popular';
      return { vehicle_type: '2', brand: brands, sort, search: searchQuery };
    }

    function applyFilters() { currentPage = 1; loadVehicles(); closeFilterDrawer(); }
    function clearFilters() {
      document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
      document.querySelector('select[name="sort"]').value = 'popular';
      currentPage = 1; loadVehicles(); closeFilterDrawer();
    }

    function loadVehicles() {
      const filters = getFilterValues();
      filters.page = currentPage;
      filters.limit = ITEMS_PER_PAGE;
      const data = API.getVehicles(filters);
      renderVehicleGrid(data.docs);
      renderPagination(data);
    }

    function renderVehicleGrid(vehicles) {
      const grid = document.getElementById('vehicleGrid');
      if (vehicles.length === 0) {
        grid.innerHTML = '<div class="no-results col-12"><h3>No scooters found</h3><p>Try adjusting your filters</p></div>';
        return;
      }
      grid.innerHTML = vehicles.map(v => `
        <div class="vehicle-card">
          <img src="${v.image}" alt="${v.title}" class="card-image" loading="lazy">
          <div class="card-body">
            <h3 class="card-title">${v.title}</h3>
            <p class="card-subtitle">by ${v.company}</p>
            <div class="card-stats">
              <div class="stat-item"><div class="stat-value">${v.price_display}</div><div class="stat-label">Ex-Showroom</div></div>
              <div class="stat-item"><div class="stat-value">${v.true_range} km</div><div class="stat-label">True Range</div></div>
              <div class="stat-item"><div class="stat-value">${v.top_speed} km/h</div><div class="stat-label">Top Speed</div></div>
              <div class="stat-item"><div class="stat-value">${v.charging_time.split(' ')[0]} hrs</div><div class="stat-label">Charging</div></div>
            </div>
          </div>
          <div class="card-footer">
            <a href="vehicle.html?slug=${v.slug}" class="btn-view-details">View Details <i class="bi bi-arrow-right"></i></a>
          </div>
        </div>
      `).join('');
    }

    function renderPagination(data) {
      const container = document.getElementById('pagination');
      if (data.totalPages <= 1) { container.innerHTML = ''; return; }
      let html = `<button ${!data.hasPrevPage ? 'disabled' : ''} onclick="goToPage(${data.prevPage})">Prev</button>`;
      for (let i = 1; i <= data.totalPages; i++) {
        html += `<button class="${i === data.page ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }
      html += `<button ${!data.hasNextPage ? 'disabled' : ''} onclick="goToPage(${data.nextPage})">Next</button>`;
      html += `<span class="page-info">Page ${data.page} of ${data.totalPages}</span>`;
      container.innerHTML = html;
    }

    function goToPage(page) { currentPage = page; loadVehicles(); window.scrollTo({ top: 300, behavior: 'smooth' }); }

    async function init() { await API.loadData(); BannerCarousel.init(); renderFilters(); loadVehicles(); }
    init();
  </script>
