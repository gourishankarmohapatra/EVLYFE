<body>
  <div id="app">
    <header id="mainHeader"></header>

    <section class="page-hero">
      <div class="container">
        <h1>EV Dealer Showrooms</h1>
        <p class="breadcrumb"><a href="index.html">Home</a> / Dealer Showrooms</p>
      </div>
    </section>

    <section class="dealer-section">
      <div class="container">
        <div style="text-align:center;margin-bottom:30px;">
          <h2 style="font-size:24px;font-weight:600;">Find Dealers In Your City</h2>
          <p style="font-size:14px;color:#666;">Locate authorized EV dealers across India</p>
        </div>

        <div class="dealer-filters">
          <div class="filter-row">
            <select id="stateFilter" onchange="onStateChange()">
              <option value="">All States</option>
            </select>
            <select id="cityFilter" onchange="filterDealers()">
              <option value="">All Cities</option>
            </select>
            <select id="brandFilter" onchange="filterDealers()">
              <option value="">All Brands</option>
            </select>
          </div>
        </div>

        <p id="dealerCount" style="font-size:14px;color:#666;margin-bottom:15px;"></p>
        <div class="dealer-grid" id="dealerGrid"></div>
      </div>
    </section>

    <footer id="mainFooter"></footer>
    <div id="backToTopBtn"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    document.getElementById('mainHeader').innerHTML = Navigation.getHeader();
    document.getElementById('mainFooter').innerHTML = Navigation.getFooter();
    document.getElementById('backToTopBtn').innerHTML = Navigation.getBackToTop();

    function renderFilters() {
      const states = API.getStates();
      const brands = [...new Set(API.dealers.map(d => d.brand))];
      document.getElementById('stateFilter').innerHTML = '<option value="">All States</option>' + states.map(s => `<option value="${s}">${s}</option>`).join('');
      document.getElementById('brandFilter').innerHTML = '<option value="">All Brands</option>' + brands.sort().map(b => `<option value="${b}">${b}</option>`).join('');
    }

    function onStateChange() {
      const state = document.getElementById('stateFilter').value;
      const cities = API.getCitiesByState(state);
      document.getElementById('cityFilter').innerHTML = '<option value="">All Cities</option>' + cities.map(c => `<option value="${c}">${c}</option>`).join('');
      filterDealers();
    }

    function filterDealers() {
      const state = document.getElementById('stateFilter').value;
      const city = document.getElementById('cityFilter').value;
      const brand = document.getElementById('brandFilter').value;
      let dealers = API.getDealers(state, city);
      if (brand) dealers = dealers.filter(d => d.brand === brand);

      document.getElementById('dealerCount').textContent = `Showing ${dealers.length} dealer${dealers.length !== 1 ? 's' : ''}`;

      const grid = document.getElementById('dealerGrid');
      if (dealers.length === 0) {
        grid.innerHTML = '<div class="no-results"><h3>No dealers found</h3><p>Try adjusting your filters</p></div>';
        return;
      }

      grid.innerHTML = dealers.map(d => `
        <div class="dealer-card">
          <span class="dealer-brand">${d.brand}</span>
          <h3 class="dealer-name">${d.name}</h3>
          <p class="dealer-info"><i class="bi bi-geo-alt"></i>${d.address}</p>
          <p class="dealer-info"><i class="bi bi-telephone"></i>${d.phone}</p>
          <p class="dealer-info"><i class="bi bi-envelope"></i>${d.email}</p>
          <p class="dealer-info"><i class="bi bi-clock"></i>${d.timings}</p>
          <div class="dealer-services">
            ${d.services.map(s => `<span>${s}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    async function init() { await API.loadData(); renderFilters(); filterDealers(); }
    init();
  </script>
</body>
</html>
