<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>EV News, Reviews & Guides - Electric Vehicle Blog | EVLYFE</title>
  <meta name="description" content="Read the latest electric vehicle news, expert reviews, buying guides, and industry insights on the EVLYFE blog.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.evlyfe.com/blog-article.html">
  <meta property="og:title" content="EV News & Blog | EVLYFE">
  <meta property="og:description" content="Read the latest electric vehicle news, expert reviews, buying guides, and industry insights.">
  <meta property="og:url" content="https://www.evlyfe.com/blog-article.html">
  <meta property="og:type" content="article">
  <meta property="og:image" content="https://www.evlyfe.com/images/logo.png">
  <meta property="og:site_name" content="EVLYFE">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@evlyfe">
  <meta name="twitter:title" content="EV News & Blog | EVLYFE">
  <meta name="twitter:description" content="Read the latest electric vehicle news, expert reviews, buying guides, and industry insights.">
  <meta name="twitter:image" content="https://www.evlyfe.com/images/logo.png">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ECY26LBRLK"></script>
  <script>window.dataLayer = window.dataLayer || [];function gtag(){dataLayer.push(arguments);}gtag('js', new Date());gtag('config', 'G-ECY26LBRLK');</script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6950966761441733" crossorigin="anonymous"></script>
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" integrity="sha384-bKJoVRJxlxsGK2lb0Q3C0YvZ03i1X1Of5XsN0Q0H6dN8Kp8M7O1p6v5X5X5X5X5" crossorigin="anonymous">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <div id="app">
    <header id="mainHeader"></header>

    <section class="listing-section">
      <div class="container">
        <div class="blog-article" id="articleContent">
          <div class="loading-spinner"></div>
        </div>
      </div>
    </section>

    <section class="blog-section">
      <div class="container">
        <div class="section-header">
          <h2>Related Articles</h2>
        </div>
        <div class="blog-grid" id="relatedBlogs"></div>
      </div>
    </section>

    <footer id="mainFooter"></footer>
    <div id="backToTopBtn"></div>
  </div>

  <script src="js/fuzzy-search.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    document.getElementById('mainHeader').innerHTML = Navigation.getHeader();
    document.getElementById('mainFooter').innerHTML = Navigation.getFooter();
    document.getElementById('backToTopBtn').innerHTML = Navigation.getBackToTop();

    const slug = new URLSearchParams(window.location.search).get('slug');

    function loadArticle() {
      if (!slug) {
        document.getElementById('articleContent').innerHTML = '<div class="no-results"><h3>Article not found</h3></div>';
        return;
      }

      const blog = API.getBlogBySlug(slug);
      if (!blog) {
        document.getElementById('articleContent').innerHTML = '<div class="no-results"><h3>Article not found</h3></div>';
        return;
      }

      document.title = `${blog.title} | EVLYFE`;

      // Dynamic SEO meta tags
      const metaDesc = blog.description || `${blog.title} - Read on EVLYFE, India's leading electric vehicle platform.`;
      document.querySelector('meta[name="description"]').setAttribute('content', metaDesc);
      const pageUrl = `https://www.evlyfe.com/blog-article.html?slug=${blog.slug}`;
      let canonicalEl = document.querySelector('link[rel="canonical"]');
      if (!canonicalEl) { canonicalEl = document.createElement('link'); canonicalEl.rel = 'canonical'; document.head.appendChild(canonicalEl); }
      canonicalEl.href = pageUrl;
      const ogTitle = document.querySelector('meta[property="og:title"]');
      const ogDesc = document.querySelector('meta[property="og:description"]');
      const ogUrl = document.querySelector('meta[property="og:url"]');
      const ogImage = document.querySelector('meta[property="og:image"]');
      const twTitle = document.querySelector('meta[name="twitter:title"]');
      const twDesc = document.querySelector('meta[name="twitter:description"]');
      const twImage = document.querySelector('meta[name="twitter:image"]');
      if (ogTitle) ogTitle.setAttribute('content', `${blog.title} | EVLYFE`);
      if (ogDesc) ogDesc.setAttribute('content', metaDesc);
      if (ogUrl) ogUrl.setAttribute('content', pageUrl);
      if (ogImage) ogImage.setAttribute('content', blog.featureImage);
      if (twTitle) twTitle.setAttribute('content', `${blog.title} | EVLYFE`);
      if (twDesc) twDesc.setAttribute('content', metaDesc);
      if (twImage) twImage.setAttribute('content', blog.featureImage);

      // JSON-LD Article schema
      const articleSchema = {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": blog.title,
        "description": metaDesc,
        "image": blog.featureImage,
        "author": {"@type": "Organization", "name": blog.author},
        "publisher": {
          "@type": "Organization",
          "name": "EVLYFE",
          "logo": {"@type": "ImageObject", "url": "https://www.evlyfe.com/images/logo.png"}
        },
        "datePublished": blog.date,
        "dateModified": blog.date,
        "url": pageUrl
      };
      const ldScript = document.createElement('script');
      ldScript.type = 'application/ld+json';
      ldScript.text = JSON.stringify(articleSchema);
      document.head.appendChild(ldScript);

      // JSON-LD BreadcrumbList
      const breadcrumbSchema = {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.evlyfe.com/"},
          {"@type": "ListItem", "position": 2, "name": "Blog", "item": "https://www.evlyfe.com/blog.html"},
          {"@type": "ListItem", "position": 3, "name": blog.title, "item": pageUrl}
        ]
      };
      const bcScript = document.createElement('script');
      bcScript.type = 'application/ld+json';
      bcScript.text = JSON.stringify(breadcrumbSchema);
      document.head.appendChild(bcScript);

      document.getElementById('articleContent').innerHTML = `
        <p class="breadcrumb" style="font-size:13px;margin-bottom:20px;">
          <a href="index.html">Home</a> / <a href="blog.html">Blog</a> / ${blog.title}
        </p>
        <div class="article-header">
          <span class="blog-category" style="display:inline-block;padding:4px 14px;background:linear-gradient(135deg,var(--gradient-start),var(--gradient-end));color:white;font-size:12px;font-weight:600;border-radius:12px;margin-bottom:12px;">${blog.category}</span>
          <h1>${blog.title}</h1>
          <p style="font-size:14px;color:#888;margin-bottom:15px;">
            <i class="bi bi-person"></i> ${blog.author} &nbsp;|&nbsp;
            <i class="bi bi-calendar3"></i> ${new Date(blog.date).toLocaleDateString('en-IN', {year:'numeric',month:'long',day:'numeric'})} &nbsp;|&nbsp;
            <i class="bi bi-eye"></i> ${blog.viewCount} views
          </p>
          <img src="${blog.featureImage}" alt="${blog.title}" style="width:100%;max-height:400px;object-fit:cover;border-radius:12px;">
        </div>
        <div class="article-content">
          ${blog.content || `<p>${blog.description}</p>`}
        </div>
      `;

      // Related blogs
      const related = API.getBlogs().filter(b => b.slug !== slug).slice(0, 3);
      document.getElementById('relatedBlogs').innerHTML = related.map(b => `
        <a href="blog-article.html?slug=${b.slug}" class="blog-card">
          <img src="${b.featureImage}" alt="${b.title}" class="blog-image" loading="lazy">
          <div class="blog-body">
            <span class="blog-category">${b.category}</span>
            <h3 class="blog-title">${b.title}</h3>
            <div class="blog-meta">
              <span><i class="bi bi-calendar3"></i> ${new Date(b.date).toLocaleDateString('en-IN')}</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    async function init() { await API.loadData(); loadArticle(); }
    init();
  </script>
</body>
</html>
