  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.evlyfe.com/"},
      {"@type": "ListItem", "position": 2, "name": "Compare Vehicles", "item": "https://www.evlyfe.com/compare.html"}
    ]
  }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>
  <div id="app">
    <header id="mainHeader"></header>

    <section class="page-hero">
      <div class="container">
        <h1>Compare Electric Vehicles</h1>
        <p class="breadcrumb"><a href="index.html">Home</a> / Compare Vehicles</p>
      </div>
    </section>

    <!-- ========== BANNER CAROUSEL ========== -->
    <section class="banner-carousel-section">
      <div id="bannerCarousel"></div>
    </section>

    <section class="listing-section">
      <div class="container">
        <div class="compare-select-wrapper" id="compareSelects"></div>
        <div class="text-center mb-4">
          <button class="btn-compare-action" onclick="compareSelected()">Compare Now</button>
        </div>
        <div id="compareResult"></div>

        <div class="section-header" style="margin-top:40px;">
          <h2>Popular Comparisons</h2>
          <p>Pre-defined vehicle comparisons</p>
        </div>
        <div class="compare-grid" id="predefinedComparisons"></div>
      </div>
    </section>

    <footer id="mainFooter"></footer>
    <div id="backToTopBtn"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/banner-carousel.js"></script>
  <script>
    document.getElementById('mainHeader').innerHTML = Navigation.getHeader();
    document.getElementById('mainFooter').innerHTML = Navigation.getFooter();
    document.getElementById('backToTopBtn').innerHTML = Navigation.getBackToTop();

    const urlParams = new URLSearchParams(window.location.search);
    const preselectedIds = urlParams.get('ids')?.split(',') || [];

    function renderSelects() {
      const vehicles = API.vehicles;
      const options = vehicles.map(v => `<option value="${v._id}">${v.title} (${v.company})</option>`).join('');
      const html = [0,1,2].map(i => `
        <div class="compare-select">
          <label style="font-weight:600;font-size:14px;display:block;margin-bottom:6px;">Vehicle ${i+1} ${i===2 ? '(Optional)' : ''}</label>
          <select id="compareVehicle${i}" onchange="updateCompare()">
            <option value="">-- Select Vehicle --</option>
            ${options}
          </select>
        </div>
      `).join('');
      document.getElementById('compareSelects').innerHTML = html;

      // Pre-select from URL or localStorage
      const saved = JSON.parse(localStorage.getItem('evlyfe_compare') || '[]');
      const ids = preselectedIds.length >= 2 ? preselectedIds : saved.map(v => v._id);
      ids.forEach((id, i) => {
        if (i < 3) {
          const sel = document.getElementById('compareVehicle' + i);
          if (sel) sel.value = id;
        }
      });

      if (ids.length >= 2) compareSelected();
    }

    function updateCompare() {
      const ids = [0,1,2].map(i => document.getElementById('compareVehicle' + i)?.value).filter(Boolean);
      localStorage.setItem('evlyfe_compare', JSON.stringify(ids.map(id => {
        const v = API.vehicles.find(x => x._id === id);
        return v ? { _id: v._id, title: v.title, image: v.image, slug: v.slug } : null;
      }).filter(Boolean)));
      Navigation.updateCompareCount();
    }

    function compareSelected() {
      const ids = [0,1,2].map(i => document.getElementById('compareVehicle' + i)?.value).filter(Boolean);
      if (ids.length < 2) {
        alert('Please select at least 2 vehicles to compare.');
        return;
      }
      const vehicles = ids.map(id => API.vehicles.find(v => v._id === id)).filter(Boolean);
      renderCompareTable(vehicles);
    }

    function renderCompareTable(vehicles) {
      if (vehicles.length < 2) return;
      const specs = [
        { label: 'Price', key: 'price_display' },
        { label: 'Vehicle Type', key: 'vehicle_type_name' },
        { label: 'Battery Capacity', fn: v => v.battery_capacity + ' kWh' },
        { label: 'True Range', fn: v => v.true_range + ' km' },
        { label: 'Top Speed', fn: v => v.top_speed + ' km/h' },
        { label: 'Charging Time', key: 'charging_time' },
        { label: 'Fast Charging', key: 'fast_charging' },
        { label: 'Motor Type', key: 'motor_type' },
        { label: 'Power', fn: v => v.power + ' kW' },
        { label: 'Torque', fn: v => v.torque + ' Nm' },
        { label: 'Seating Capacity', key: 'seating_capacity' },
        { label: 'Weight', fn: v => v.weight + ' kg' },
        { label: 'Boot Space', fn: v => v.boot_space + ' L' },
        { label: 'Body Type', fn: v => v.specifications?.body_type || '-' },
        { label: 'Ground Clearance', fn: v => (v.specifications?.ground_clearance || '-') + ' mm' },
        { label: 'Drivetrain', fn: v => v.specifications?.drivetrain || '-' },
        { label: 'Rating', fn: v => v.rating + ' / 5' },
      ];

      let html = '<div class="compare-table-wrapper"><table class="compare-table"><thead><tr><th>Specification</th>';
      vehicles.forEach(v => { html += `<th>${v.title}</th>`; });
      html += '</tr></thead><tbody>';

      // Image row
      html += '<tr><td>Image</td>';
      vehicles.forEach(v => { html += `<td><img src="${v.image}" alt="${v.title}" style="width:150px;height:100px;object-fit:cover;border-radius:8px;"></td>`; });
      html += '</tr>';

      specs.forEach(s => {
        html += `<tr><td>${s.label}</td>`;
        vehicles.forEach(v => {
          const val = s.fn ? s.fn(v) : v[s.key] || '-';
          html += `<td>${val}</td>`;
        });
        html += '</tr>';
      });

      // Features row
      html += '<tr><td>Key Features</td>';
      vehicles.forEach(v => {
        html += `<td style="text-align:left;font-size:12px;">${(v.features||[]).slice(0,5).map(f => '• ' + f).join('<br>')}</td>`;
      });
      html += '</tr>';

      html += '</tbody></table></div>';
      html += '<div class="text-center mt-3"><a href="electric-vehicles.html" class="btn-apply" style="display:inline-block;padding:12px 30px;">Explore More EVs</a></div>';
      document.getElementById('compareResult').innerHTML = html;
    }

    function loadPredefined() {
      const comps = API.getComparisons();
      const grid = document.getElementById('predefinedComparisons');
      grid.innerHTML = comps.map(c => {
        const vehicles = API.getComparisonByIds(c.vehicle_ids);
        return `
          <div class="compare-card">
            <img src="${vehicles[0]?.image}" alt="${vehicles[0]?.title}">
            <span class="vs-badge">VS</span>
            <img src="${vehicles[1]?.image}" alt="${vehicles[1]?.title}">
            <div class="compare-info"><h4>${c.title}</h4><p>${c.category}</p></div>
            <button class="btn-compare-now" onclick="loadPredefinedCompare('${c.vehicle_ids[0]}','${c.vehicle_ids[1]}')">Compare</button>
          </div>`;
      }).join('');
    }

    function loadPredefinedCompare(id1, id2) {
      document.getElementById('compareVehicle0').value = id1;
      document.getElementById('compareVehicle1').value = id2;
      compareSelected();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function init() { await API.loadData(); BannerCarousel.init(); renderSelects(); loadPredefined(); }
    init();
  </script>
</body>
</html>
