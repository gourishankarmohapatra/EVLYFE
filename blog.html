    "itemListElement": [
      {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.evlyfe.com/"},
      {"@type": "ListItem", "position": 2, "name": "Blog", "item": "https://www.evlyfe.com/blog.html"}
    ]

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
  <div id="app">
    <header id="mainHeader"></header>

    <section class="page-hero">
      <div class="container">
        <h1>EV News & Blog</h1>
        <p class="breadcrumb"><a href="index.html">Home</a> / Blog</p>
      </div>
    </section>

    <section class="news-ticker-section">
      <div class="container">
        <div id="newsTicker"></div>
      </div>
    </section>

    <section class="blog-section">
      <div class="container">
        <div class="blog-grid" id="blogGrid"></div>
      </div>
    </section>

    <footer id="mainFooter"></footer>
    <div id="backToTopBtn"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/news-ticker.js"></script>
  <script>
    document.getElementById('mainHeader').innerHTML = Navigation.getHeader();
    document.getElementById('mainFooter').innerHTML = Navigation.getFooter();
    document.getElementById('backToTopBtn').innerHTML = Navigation.getBackToTop();

    function loadBlogs() {
      const blogs = API.getBlogs();
      const grid = document.getElementById('blogGrid');
      grid.innerHTML = blogs.map(b => `
        <a href="blog-article.html?slug=${b.slug}" class="blog-card">
          <img src="${b.featureImage}" alt="${b.title}" class="blog-image" loading="lazy">
          <div class="blog-body">
            <span class="blog-category">${b.category}</span>
            <h3 class="blog-title">${b.title}</h3>
            <div class="blog-meta">
              <span><i class="bi bi-person"></i> ${b.author}</span>
              <span><i class="bi bi-calendar3"></i> ${new Date(b.date).toLocaleDateString('en-IN', {year:'numeric',month:'short',day:'numeric'})}</span>
              <span><i class="bi bi-eye"></i> ${b.viewCount} views</span>
            </div>
            <p class="blog-excerpt">${b.description}</p>
          </div>
        </a>
      `).join('');
    }

    async function init() {
      await API.loadData();
      loadBlogs();
      NewsTicker.init();
    }
    init();
  </script>
</body>
</html>
